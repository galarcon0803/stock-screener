name: Daily Stock Report

on:
  schedule:
    # 13:30 UTC = 9:30 AM ET (market open), weekdays. Cron is UTC and does not
    # adjust for US daylight-saving; shift to '30 14 * * 1-5' during EST if needed.
    - cron: '30 13 * * 1-5'
  workflow_dispatch: {}        # manual trigger from the Actions tab

# Allow committing the updated DB back to the repo (primary persistence).
permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Belt-and-suspenders persistence: the DB is committed to the repo (below),
      # but cache restore covers the gap if a run starts before a prior commit.
      - name: Restore DB cache
        uses: actions/cache/restore@v4
        with:
          path: data/sentiment.db
          key: sentiment-db-${{ github.run_id }}
          restore-keys: |
            sentiment-db-

      - name: Run pipeline
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: python main.py

      - name: Save DB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/sentiment.db
          key: sentiment-db-${{ github.run_id }}

      - name: Commit updated database
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sentiment.db
          if git diff --staged --quiet; then
            echo "No DB changes to commit."
          else
            git commit -m "chore: update sentiment.db [skip ci]"
            git push
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: out/*.html
          if-no-files-found: ignore
          retention-days: 14
